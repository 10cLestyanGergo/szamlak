<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Számlák</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Számlakezelő</h1>
      <div id="authControls">
        <a href="/login.html">Bejelentkezés</a>
        <a href="/register.html">Regisztráció</a>
      </div>
    </header>

    <!-- centered auth for unauthenticated users -->

    <div id="authCenter" class="auth-center" style="display: none">
      <div class="auth-center-inner">
        <a class="btn-link" href="/login.html">Bejelentkezés</a>
        <a class="btn-link" href="/register.html">Regisztráció</a>
      </div>
    </div>

    <main>
      <section class="controls">
        <div id="userInfo"></div>
        <button id="logoutBtn" style="display: none">Kijelentkezés</button>
      </section>

      <section class="new-invoice">
        <h2>Új számla</h2>
        <form id="invoiceForm">
          <input name="client" placeholder="Ügyfél" required />
          <input
            name="amount"
            type="number"
            step="0.01"
            placeholder="Összeg"
            required
          />
          <select name="status">
            <option value="pending">Függő</option>
            <option value="paid">Fizetve</option>
            <option value="overdue">Lejárt</option>
          </select>
          <input name="due_date" type="date" />
          <button type="submit">Mentés</button>
          <button
            id="cancelEdit"
            type="button"
            style="display: none; margin-left: 8px"
          >
            Mégse
          </button>
        </form>
      </section>

      <section>
        <h2>Számlák</h2>
        <table id="invoicesTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Ügyfél</th>
              <th>Összeg</th>
              <th>Státusz</th>
              <th>Esedékesség</th>
              <th>Műveletek</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script>
      const tokenKey = "szamla_token";

      function setAuthUI(user) {
        const userInfo = document.getElementById("userInfo");
        const logoutBtn = document.getElementById("logoutBtn");
        if (user) {
          userInfo.textContent = "Bejelentkezve: " + user.email;
          logoutBtn.style.display = "inline-block";
          // hide center auth and show main app
          const ac = document.getElementById("authCenter");
          if (ac) ac.style.display = "none";
          document.querySelector("main").style.display = "";
        } else {
          userInfo.textContent = "";
          logoutBtn.style.display = "none";
          // show only centered auth controls and hide main app when logged out
          const ac = document.getElementById("authCenter");
          if (ac) ac.style.display = "flex";
          document.querySelector("main").style.display = "none";
          // clear visible invoices and reset form when logged out / unauthorized
          const tbody = document.querySelector("#invoicesTable tbody");
          if (tbody) tbody.innerHTML = "";
          const form = document.getElementById("invoiceForm");
          if (form) form.reset();
          editingId = null;
          if (typeof setFormMode === "function") setFormMode(false);
        }
      }

      function authHeaders() {
        const token = localStorage.getItem(tokenKey);
        return token
          ? {
              Authorization: "Bearer " + token,
              "Content-Type": "application/json",
            }
          : { "Content-Type": "application/json" };
      }

      // Editing state
      let editingId = null;

      function setFormMode(editing) {
        const btn = document.querySelector(
          '#invoiceForm button[type="submit"]'
        );
        if (editing) {
          btn.textContent = "Frissítés";
          btn.dataset.editing = "1";
          const cancel = document.getElementById("cancelEdit");
          if (cancel) cancel.style.display = "";
        } else {
          btn.textContent = "Mentés";
          delete btn.dataset.editing;
          const cancel = document.getElementById("cancelEdit");
          if (cancel) cancel.style.display = "none";
        }
      }

      function populateForm(inv) {
        const f = document.getElementById("invoiceForm");
        f.elements["client"].value = inv.client || "";
        f.elements["amount"].value = inv.amount != null ? inv.amount : "";
        f.elements["status"].value = inv.status || "pending";
        f.elements["due_date"].value = inv.due_date || "";
      }

      async function loadInvoices() {
        const res = await fetch("/api/invoices", { headers: authHeaders() });
        if (res.status === 401) {
          setAuthUI(null);
          const tbody = document.querySelector("#invoicesTable tbody");
          if (tbody) tbody.innerHTML = "";
          return;
        }
        const invoices = await res.json();
        const tbody = document.querySelector("#invoicesTable tbody");
        tbody.innerHTML = "";
        invoices.forEach((inv) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
          <td>${inv.id}</td>
          <td>${inv.client}</td>
          <td>${inv.amount.toFixed(2)}</td>
          <td><span class="status ${inv.status}">${inv.status}</span></td>
          <td>${inv.due_date || ""}</td>
          <td>
            <button data-id="${inv.id}" class="edit">Szerkeszt</button>
            <button data-id="${inv.id}" class="del">Töröl</button>
          </td>
        `;
          tbody.appendChild(tr);
        });
      }

      document
        .getElementById("invoiceForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const body = {
            client: fd.get("client"),
            amount: Number(fd.get("amount")),
            status: fd.get("status"),
            due_date: fd.get("due_date") || null,
          };

          const submitBtn = e.target.querySelector('button[type="submit"]');
          if (submitBtn.dataset.editing && editingId) {
            // Update existing invoice
            const res = await fetch("/api/invoices/" + editingId, {
              method: "PUT",
              headers: authHeaders(),
              body: JSON.stringify(body),
            });
            if (res.ok) {
              e.target.reset();
              editingId = null;
              setFormMode(false);
              loadInvoices();
            } else if (res.status === 401) {
              alert("Be kell jelentkezni");
            } else {
              const err = await res.json().catch(() => ({}));
              alert(err.error || "Hiba mentés közben");
            }
          } else {
            // Create new
            const res = await fetch("/api/invoices", {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify(body),
            });
            if (res.ok) {
              e.target.reset();
              loadInvoices();
            } else if (res.status === 401) {
              alert("Be kell jelentkezni");
            } else {
              const err = await res.json().catch(() => ({}));
              alert(err.error || "Hiba");
            }
          }
        });

      // Cancel edit button
      document.getElementById("cancelEdit").addEventListener("click", (e) => {
        const form = document.getElementById("invoiceForm");
        form.reset();
        editingId = null;
        setFormMode(false);
      });

      document
        .querySelector("#invoicesTable")
        .addEventListener("click", async (e) => {
          if (e.target.matches(".del")) {
            const id = e.target.dataset.id;
            if (!confirm("Biztos törli?")) return;
            const res = await fetch("/api/invoices/" + id, {
              method: "DELETE",
              headers: authHeaders(),
            });
            if (res.ok) loadInvoices();
            else alert("Hiba");
          }

          if (e.target.matches(".edit")) {
            const id = e.target.dataset.id;
            // fetch invoice details and populate form
            const res = await fetch("/api/invoices", {
              headers: authHeaders(),
            });
            if (res.status === 401) {
              alert("Be kell jelentkezni");
              return;
            }
            const invoices = await res.json();
            const inv = invoices.find((x) => String(x.id) === String(id));
            if (!inv) {
              alert("Nem található");
              return;
            }
            editingId = id;
            populateForm(inv);
            setFormMode(true);
            document.getElementById("invoiceForm").elements["client"].focus();
          }
        });

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem(tokenKey);
        setAuthUI(null);
        const tbody = document.querySelector("#invoicesTable tbody");
        if (tbody) tbody.innerHTML = "";
        const form = document.getElementById("invoiceForm");
        if (form) form.reset();
        editingId = null;
        if (typeof setFormMode === "function") setFormMode(false);
      });

      // Try to check if token is valid by calling invoices
      (async function init() {
        const token = localStorage.getItem(tokenKey);
        if (!token) {
          setAuthUI(null);
          return;
        }
        const res = await fetch("/api/invoices", { headers: authHeaders() });
        if (res.status === 401) {
          setAuthUI(null);
        } else {
          // can't get user email from token with current API, but show simple UI
          setAuthUI({ email: "user" });
          loadInvoices();
        }
      })();
    </script>
  </body>
</html>
